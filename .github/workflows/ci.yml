name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tip kontrolu
        run: npm run typecheck

      - name: Testler
        run: npm test

      - name: Derleme
        run: npm run build

      # Uretilen dosya spec ile ayni olmali; PR'da yeniden uretmeyi unutanlari yakalar.
      - name: Uretilen dosya guncel mi
        run: |
          npm run generate
          git diff --exit-code src/generated/operations.ts
