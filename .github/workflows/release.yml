name: Release

# v0.1.0 gibi bir etiket push edildiginde npm'e ve MCP Registry'ye yayinlar.
#   npm version minor && git push --follow-tags
#
# Kimlik dogrulama token'siz yapilir:
#   - npm     : Trusted Publishing (OIDC). npmjs.com > paket > Settings >
#               Trusted Publisher altinda bu depo ve bu dosya adi tanimli olmali.
#   - Registry: GitHub OIDC.
# Ikisi de asagidaki id-token: write iznine dayanir.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  PACKAGE_NAME: "@ubaranzorlu/fonzip-mcp"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Etiket ile package.json/server.json surumleri ayni olmali.
      - name: Surum tutarliligi
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srv_pkg=$(node -p "require('./server.json').packages[0].version")
          echo "etiket=$tag package.json=$pkg server.json=$srv paket=$srv_pkg"
          test "$tag" = "$pkg" && test "$tag" = "$srv" && test "$tag" = "$srv_pkg"

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing (OIDC) ve provenance imzasi icin gerekli.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing Node >= 22.14 istiyor.
          node-version: "22.14"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ile gelen npm 10.x trusted publishing'i bilmiyor; >= 11.5.1 sart.
      - name: npm CLI surumunu yukselt
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Ilk surum elden yayinlanmis olabilir. Ayni surumu tekrar gondermek
      # npm tarafindan reddedilir; bu adim boyle bir durumda isi sessizce atlar.
      - name: Bu surum npm'de var mi
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "$PACKAGE_NAME@$version" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$version zaten yayinda, atlaniyor"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Token yok: kimlik OIDC ile dogrulaniyor, provenance otomatik uretiliyor.
      - name: npm'e yayinla
        if: steps.check.outputs.published == 'false'
        run: npm publish

  registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # MCP Registry'de GitHub OIDC ile kimlik dogrulama.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: mcp-publisher kur
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      # npm'in yeni surumu dagitmasi birkac saniye surebiliyor; registry
      # paketin gercekten var oldugunu dogruluyor.
      - name: npm yayinini bekle
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if npm view "$PACKAGE_NAME@$version" version >/dev/null 2>&1; then
              echo "npm'de gorunur"
              exit 0
            fi
            echo "bekleniyor ($i/30)..."
            sleep 10
          done
          echo "npm'de $version bulunamadi"
          exit 1

      - run: mcp-publisher login github-oidc

      # Ayni surum registry'de varsa publish hata verir; release'in tamami
      # bu yuzden kirmizi olmasin.
      - name: Registry'ye yayinla
        run: mcp-publisher publish || echo "Registry yayini atlandi (surum muhtemelen zaten kayitli)"

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release olustur
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
